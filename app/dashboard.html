<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Home</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f4f5f7; color: #222; margin: 0; padding: 24px; }
  h1 { margin-top: 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; }
  .card { background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 1px 3px #0002; }
  .label { font-size: 14px; color: #666; }
  .value { font-size: 32px; font-weight: 600; margin-top: 4px; }
  .warn { background: #fde8e8; }
  .on { background: #fff7cc; }
</style>
</head>
<body>
<h1>Smart Home</h1>
<div class="grid">
  <div class="card"><div class="label">Temperature</div><div class="value" id="temperature">–</div></div>
  <div class="card"><div class="label">Humidity</div><div class="value" id="humidity">–</div></div>
  <div class="card"><div class="label">Pressure</div><div class="value" id="pressure">–</div></div>
  <div class="card" id="pmcard"><div class="label">Particles PM2.5</div><div class="value" id="pm25">–</div></div>
  <div class="card"><div class="label">CO (estimate)</div><div class="value" id="co">–</div></div>
  <div class="card"><div class="label">NO₂ (estimate)</div><div class="value" id="no2">–</div></div>
  <div class="card"><div class="label">NH₃ (estimate)</div><div class="value" id="nh3">–</div></div>
  <div class="card"><div class="label">Light sensor</div><div class="value" id="lux">–</div></div>
  <div class="card"><div class="label">Motion</div><div class="value" id="motion">–</div></div>
  <div class="card" id="lightcard"><div class="label">Lamp</div><div class="value" id="light">–</div></div>
</div>
<p id="advice"></p>
<p class="label">Gas values are rough estimates in ppm (parts per million), not lab measurements. The sensor needs time to warm up and must be calibrated in fresh air.</p>
<script>
const ppm = v => v === null ? '–' : v + ' ppm';
async function refresh() {
  const s = await (await fetch('/api/state')).json();
  if (!s.time) return;
  temperature.textContent = s.temperature + ' °C';
  humidity.textContent = s.humidity + ' %';
  pressure.textContent = s.pressure + ' hPa';
  pm25.textContent = s.pm25 === null ? 'no sensor' : s.pm25 + ' µg/m³';
  co.textContent = ppm(s.co_ppm);
  no2.textContent = ppm(s.no2_ppm);
  nh3.textContent = ppm(s.nh3_ppm);
  lux.textContent = s.lux + ' lux';
  motion.textContent = s.motion ? 'Yes' : 'No';
  light.textContent = s.light ? 'ON' : 'OFF';
  pmcard.classList.toggle('warn', s.ventilate);
  lightcard.classList.toggle('on', s.light);
  advice.textContent = s.ventilate ? '⚠️ Lots of particles in the air, open a window.' : '';
}
refresh(); setInterval(refresh, 2000);
</script>
</body>
</html>
